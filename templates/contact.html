{% extends "base.html" %}
{% block title %}Contact — QuizNova{% endblock %}
{% block content %}
<section class="section">
  <div class="container-xs" style="text-align:center;">
    <div class="section-eyebrow" style="display:inline-flex;margin-bottom:var(--s3);">Get in Touch</div>
    <h1 class="font-display" style="font-size:clamp(2rem,5vw,3rem);font-weight:800;margin-bottom:var(--s3);">Contact Us</h1>
    <p style="font-size:17px;color:var(--text-2);line-height:1.8;margin-bottom:var(--s6);">
      Have a question, suggestion, or issue? We'd love to hear from you.
    </p>
    <div class="card p-5" style="text-align:left;max-width:480px;margin-inline:auto;">
      <form class="auth-form">
        <div class="form-group">
          <label class="form-label" for="contact-name">Name</label>
          <input type="text" id="contact-name" class="input" placeholder="Your name">
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-email">Email</label>
          <input type="email" id="contact-email" class="input" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-message">Message</label>
          <textarea id="contact-message" class="input textarea" placeholder="How can we help?"></textarea>
        </div>
        <button type="button" class="btn btn-primary btn-full" onclick="alert('Thank you! We will get back to you shortly.')">Send Message</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
