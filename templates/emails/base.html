<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject | default('QuizNova Notification') }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #F1F1F8;
      -webkit-font-smoothing: antialiased;
    }
    table { border-collapse: collapse; }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #0d0d1a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #0d0d1a 0%, #141425 100%);
      padding: 28px 24px;
      text-align: center;
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
    }
    .logo-text {
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    .logo-accent {
      color: #7C3AED;
    }
    .content {
      padding: 32px 28px;
    }
    .h1 {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin: 0 0 16px 0;
    }
    .p {
      font-size: 15px;
      line-height: 1.6;
      color: #9898B0;
      margin: 0 0 18px 0;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #7C3AED, #2563EB);
      color: #FFFFFF !important;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 26px;
      text-decoration: none;
      border-radius: 30px;
      margin: 12px 0;
      text-align: center;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #F1F1F8 !important;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .card {
      background-color: #141425;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 18px;
      margin: 18px 0;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 20px;
      background: rgba(124, 58, 237, 0.15);
      color: #A78BFA;
      border: 1px solid rgba(124, 58, 237, 0.3);
    }
    .footer {
      background-color: #080810;
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: #5A5A72;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .footer a {
      color: #9898B0;
      text-decoration: underline;
    }
    @media only screen and (max-width: 600px) {
      .content { padding: 20px 16px !important; }
      .container { width: 100% !important; border-radius: 0 !important; }
    }
  </style>
</head>
<body>
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #050508; padding: 20px 0;">
    <tr>
      <td align="center">
        <table class="container" width="600" cellpadding="0" cellspacing="0">
          <!-- Header -->
          <tr>
            <td class="header">
              <a href="{{ site_url }}" style="text-decoration: none;">
                <img src="{{ site_url }}/static/images/quiznova_logo.png" alt="QuizNova" style="max-height: 40px; display: block; margin: 0 auto 6px auto; border: 0;" onerror="this.style.display='none';">
                <span class="logo-text">Quiz<span class="logo-accent">Nova</span></span>
              </a>
            </td>
          </tr>
          <!-- Body Content -->
          <tr>
            <td class="content">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td class="footer">
              <p style="margin: 0 0 8px 0;">QuizNova • Learn • Compete • Achieve</p>
              <p style="margin: 0 0 8px 0;">Founded by Mahanthesh Ganiga</p>
              {% if show_unsubscribe and unsubscribe_url %}
                <p style="margin: 8px 0 0 0; font-size: 11px;">
                  If you no longer wish to receive these marketing updates, you can <a href="{{ unsubscribe_url }}">unsubscribe here</a>.
                </p>
              {% endif %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
