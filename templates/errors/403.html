{% extends "base.html" %}
{% block title %}403 — Access Denied — QuizNova{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--space-12);">
  <div style="font-size:6rem;margin-bottom:var(--space-4);" aria-hidden="true">🚫</div>
  <h1 class="font-display" style="font-size:var(--text-5xl);font-weight:800;color:var(--error);margin-bottom:var(--space-4);">403</h1>
  <h2 style="font-size:var(--text-2xl);font-weight:600;margin-bottom:var(--space-4);">Access Denied</h2>
  <p style="color:var(--text-secondary);max-width:400px;line-height:1.7;margin-bottom:var(--space-8);">
    You don't have permission to view this page. If you think this is a mistake, please contact support.
  </p>
  <a href="{{ url_for('public.home') }}" class="btn btn-primary btn-lg" id="err-403-home-btn">← Go Home</a>
</div>
{% endblock %}
