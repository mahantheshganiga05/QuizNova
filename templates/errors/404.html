{% extends "base.html" %}
{% block title %}404 — Page Not Found — QuizNova{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--space-12);">
  <div style="font-size:6rem;margin-bottom:var(--space-4);" aria-hidden="true">🔍</div>
  <h1 class="font-display" style="font-size:var(--text-5xl);font-weight:800;background:var(--gradient-brand);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:var(--space-4);">404</h1>
  <h2 style="font-size:var(--text-2xl);font-weight:600;margin-bottom:var(--space-4);">Page Not Found</h2>
  <p style="color:var(--text-secondary);max-width:400px;line-height:1.7;margin-bottom:var(--space-8);">
    The page you're looking for doesn't exist or has been moved. Let's get you back on track.
  </p>
  <div style="display:flex;gap:var(--space-4);">
    <a href="{{ url_for('public.home') }}" class="btn btn-primary btn-lg" id="err-home-btn">← Go Home</a>
    <a href="{{ url_for('quiz.categories') }}" class="btn btn-ghost btn-lg" id="err-quiz-btn">Browse Quizzes</a>
  </div>
</div>
{% endblock %}
