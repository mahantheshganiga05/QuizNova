"{% block content %}\n\n<!-- Top Continuous Marquee Announcement Bar -->\n{% if featured_competitions %}\n<div class=\"marquee-container\">\n  <div class=\"marquee-track\">\n    {% for i in range(4) %}\n      {% for comp in featured_competitions %}\n      <a href=\"{{ url_for('competitions.detail', slug=comp.slug) }}\" class=\"marquee-item\">\n        <span class=\"badge badge-error\" style=\"animation:pulseGlow 2s infinite;\">🏆 CONTEST</span>\n        <span>{{ comp.title }} — Registration Open (Prize: {{ comp.prize_pool_text }})</span>\n        <span style=\"color:var(--brand-cyan);\">View Details →</span>\n      </a>\n      <span style=\"color:rgba(255,255,255,0.2);\">•</span>\n      {% endfor %}\n    {% endfor %}\n  </div>\n</div>\n{% endif %}"
